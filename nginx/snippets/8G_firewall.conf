########################################################
# 8G FIREWALL v1.5 (Perishable Press) — Nginx Port
# 
# FILE: nginx/snippets/8G_firewall.conf
#
# PURPOSE:
#   A near-lossless translation of the original Apache 8G Firewall
#   rules into Nginx syntax using 'if' blocks and 'set' variables.
#
# WHERE TO INCLUDE THIS FILE:
#   Include this file INSIDE a server {} block (NOT in http {}):
#
#     server {
#         listen 443 ssl;
#         server_name example.com;
#
#         include /etc/nginx/snippets/8G_firewall.conf;
#
#         location / { ... }
#     }
#
# ALTERNATIVE:
#   For a map-based, higher-performance approach (recommended for most
#   deployments), use firewall.conf instead. See that file's header for
#   details.
#
# Original URI: https://perishablepress.com/8g-firewall/
########################################################

# 8G:[CORE]
server_tokens off;
autoindex off;

# 8G:[QUERY STRING]
