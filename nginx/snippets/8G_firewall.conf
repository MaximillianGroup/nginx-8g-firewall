if ($request_uri ~* "(/)(admin-?|file-?)(upload)(bg|_?file|ify|svu|ye)?(\.php)|(/)(etc|var)(/)(hidden|secret|shadow|ninja|passwd|tmp)(/)?$|(s)?(ftp|http|inurl|php)(s)?(:(/|%2f|%u2215)(/|%2f|%u2215))") { set $8g_uri_block 1; }
if ($request_uri ~* "(/)(=|\$&?|&?(pws|rk)=0|_mm|_vti_|cgi(\.|-)|(=|/|;|,)nt\.)|(\.)(ds_store|htaccess|htpasswd|init?|mysql-select-db)(/)?$|(/)(bin)(/)(cc|chmod|chsh|cpp|echo|id|kill|mail|nasm|perl|ping|ps|python|tclsh)(/)?$") { set $8g_uri_block 1; }
