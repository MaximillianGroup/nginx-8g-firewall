# ========================================================================
# 8G FIREWALL for NGINX — Map-Based Enhanced Version
# Version: 1.0
#
# FILE: nginx/snippets/firewall.conf
#
# PURPOSE:
#   An enhanced Nginx implementation of the 8G Firewall that uses
#   Nginx's map/geo directives for better performance and readability.
#   Includes rate limiting zones, security headers, IP blocking,
#   combined $block_all detection variable, and optional logging.
#
# WHERE TO INCLUDE THIS FILE:
#   Include this file INSIDE the http {} block of nginx.conf (NOT in
#   a server {} block — map, geo, and limit_req_zone directives are
#   only valid at the http context level):
#
#     http {
#         include /etc/nginx/snippets/8g-firewall.conf;
#         ...
#     }
#
#   Then activate blocking inside each server {} block:
#
#     server {
#         limit_conn 8g_conn 20;
#         limit_req zone=8g_global burst=50 nodelay;
#         if ($block_all) { return 444; }
#         ...
#     }
#
# ALTERNATIVE:
#   For a simpler, if-based approach that is included directly in a
#   server {} block, use 8G_firewall.conf instead. See that file's
#   header for details.
#
# Original 8G Firewall: https://perishablepress.com/8g-firewall/
# Created by: Jeff Starr @ Perishable Press
#
# ========================================================================

# ---------------------------
# Logging formats
# ---------------------------
log_format blocked_8g '$remote_addr - $remote_user [$time_local] '
                      '"$request" status=$status blocked=$block_all ua="$http_user_agent" '
                      'ref="$http_referer" q="$query_string" rt=$request_time';

# Enable logging of blocked requests (optional - uncomment to enable)
# Make sure the log directory exists and is writable by nginx
# access_log /var/log/nginx/8g-blocked.log blocked_8g if=$block_all;

# ---------------------------
# Rate limiting zones
# ---------------------------
limit_req_zone $binary_remote_addr zone=8g_global:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=8g_login:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=8g_conn:10m;

# ---------------------------
# 8G FIREWALL RULES - Detection Maps
# ---------------------------

# Geo-based IP blocking (add your blocked IPs/ranges here)
geo $blocked_ip {
    default 0;
    # Example: Add malicious IP ranges
    # 192.0.2.0/24 1;
    # 198.51.100.0/24 1;
}

# Block common bad user agents, scanners, and automated tools
map $http_user_agent $bad_bot {
    default 0;
    
    # Security scanners and penetration testing tools
    "~*(?i)(acunetix|nikto|sqlmap|netsparker|dirbuster|masscan|burpsuite|wpscan|fimap|havij)" 1;
    
    # Command-line tools often used in attacks
    # NOTE: Blocking these tools may break legitimate API integrations, CI/CD, and monitoring
    # Comment out the line below if you need to allow these tools for legitimate purposes
    "~*(?i)(curl|wget|python-requests|libwww-perl|go-http-client|axios)" 1;
    
    # Headless browsers and automation
    "~*(?i)(phantomjs|headlesschrome|puppeteer|selenium|webdriver)" 1;
    
    # Generic malicious patterns
    "~*(?i)(backdoor|exploit|virus|trojan|worm)" 1;
    
    # Empty user agent (suspicious)
    "~*^$" 1;
}

# Block suspicious referrer domains
map $http_referer $block_referer {
    default 0;
    
    # Spam and malicious domains
    "~*(?i)(poker|viagra|cialis|levitra|ambien)" 1;
    "~*(?i)(dating|porn|adult|sex|xxx|casino|gambling|pharma|pharmacy)" 1;
    "~*(?i)(semalt|buttons-for-website|social-buttons)" 1;
    
    # Suspicious TLDs often used in attacks
    # NOTE: Blocking country/generic TLDs may cause false positives for legitimate international traffic
    # Remove or comment out specific TLDs if you have legitimate traffic from these domains
    "~*\.(?:ru|cn|xyz|top|buzz|icu|gq|ml|ga|cf|tk)$" 1;
}

# Block suspicious query strings - XSS, SQLi, RCE patterns
map $query_string $block_query {
    default 0;
    
    # Cross-Site Scripting (XSS) attempts
    "~*(?i)(<script|</script|javascript:|data:text/html|vbscript:)" 1;
    "~*(?i)(onerror=|onload=|onclick=|onmouseover=)" 1;
    "~*(?i)(alert\(|eval\(|prompt\(|confirm\()" 1;
    "~*(?i)(document\.cookie|window\.location|document\.write)" 1;
    "~*(?i)(<iframe|<object|<embed|<applet)" 1;
    
    # SQL Injection attempts
    "~*(?i)(\bunion\s+select\b|\bunion\s+all\s+select\b)" 1;
    "~*(?i)(\binformation_schema\b|mysql\.|database\()" 1;
    "~*(?i)(sleep\(\d+\)|benchmark\(|waitfor\s+delay)" 1;
    "~*(?i)(load_file\(|into\s+outfile\b|into\s+dumpfile\b)" 1;
    "~*(?i)(concat\(|group_concat\(|char\(|unhex\()" 1;
    "~*(?i)(base64_decode\(|base64_encode\()" 1;
    "~*(?i)(0x[0-9a-f]{2,})" 1;
    
    # Remote Code Execution (RCE) attempts
    "~*(?i)(exec\(|shell_exec\(|system\(|passthru\()" 1;
    "~*(?i)(;wget\s|;curl\s|;nc\s|;netcat\s)" 1;
    "~*(?i)(;rm\s|;bash\s|;sh\s|;perl\s|;python\s)" 1;
    
    # Directory traversal attempts
    "~*(?i)(etc/passwd|etc/shadow|proc/self/environ)" 1;
    "~*(?i)(/etc/hosts|\.ssh|\.bash_history)" 1;
    "~*(?i)(\.\.\\|\.\.\/|%2e%2e)" 1;
    
    # Extremely long query strings (possible DoS or overflow)
    "~*[A-Za-z0-9]{1000,}" 1;
    
    # Null byte injection
    "~*(%00|\\x00)" 1;
}

# Block suspicious request URIs and dangerous file access
map $request_uri $block_uri {
    default 0;
    
    # Common web shells and admin tools
    "~*(?i)(phpinfo|shell\.php|c99\.php|r57\.php|wso\.php)" 1;
    "~*(?i)(phpmyadmin|pma|adminer|myadmin)" 1;
    "~*(?i)(sqlmap|log4shell)" 1;
    
    # Sensitive files and directories
    "~*(?i)(/\.env|/\.git|/\.svn|/\.hg)" 1;
    "~*(?i)(/\.htaccess|/\.htpasswd|web\.config)" 1;
    "~*(?i)(\.sql$|\.bak$|\.backup$|\.old$|\.orig$)" 1;
    "~*(?i)(backup/|backups/|\.backup/)" 1;
    
    # System directories
    "~*(?i)(/etc/|/proc/|/root/|/sys/|/dev/)" 1;
    "~*(?i)(/tmp/|/var/log/|/var/tmp/)" 1;
    
    # Dangerous file extensions
    "~*\.(?:cgi|asp|aspx|dll|exe|jsp|mdb|ini|sh|bat|cmd)$" 1;
    "~*\.(?:pl|ps1|vbs|pfx|pem|crt|key)$" 1;
    
    # WordPress specific attacks
    "~*(?i)(wp-config\.php|wp-config\.txt|wp-config\.bak)" 1;
    "~*(?i)(/wp-admin/install\.php|/wp-admin/setup-config\.php)" 1;
}

# Block dangerous HTTP methods
map $request_method $block_method {
    default 0;
    # These methods are rarely used legitimately and pose security risks
    "~*(?:TRACE|TRACK|CONNECT)" 1;
    "~*(?:MOVE|PROPFIND|PROPPATCH|COPY|LOCK|UNLOCK|MKCOL)" 1;
    # Note: DELETE, PATCH, PUT are NOT blocked by default (value 0) to allow REST APIs
    # If you don't use REST APIs, uncomment the line below to block them:
    # "~*(?:DELETE|PATCH|PUT)" 1;
}

# Combine all detectors into a single blocking flag
map "$blocked_ip$bad_bot$block_referer$block_query$block_uri$block_method" $block_all {
    default 0;
    "~*1" 1;
}

# ---------------------------
# Security Headers
# ---------------------------
# Note: These are applied globally. Adjust per-location if needed.
# 
# IMPORTANT: When using add_header in a location block, nginx will NOT inherit
# headers from parent blocks. If you use add_header in a location, you must
# re-add ALL security headers you want in that location's responses.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# X-XSS-Protection set to '0' as modern browsers deprecate this in favor of CSP
# Setting to '1' can actually introduce vulnerabilities in older browsers
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS (uncomment if using HTTPS - adjust max-age as needed)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy (adjust for your needs)
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

# ---------------------------
# 8G FIREWALL - Server Block Configuration
# ---------------------------
# 
# Add the following to your server {} blocks to activate the firewall:
#
# Example for server block:
#
#   server {
#       ...
#       
#       # Apply rate limiting
#       limit_conn 8g_conn 20;
#       limit_req zone=8g_global burst=50 nodelay;
#       
#       # Block malicious requests
#       if ($block_all) {
#           return 444;  # Close connection without response
#       }
#       
#       # Optional: Block bad bots explicitly
#       if ($bad_bot = 1) {
#           return 444;
#       }
#       
#       # Optional: Block bad referers with 403
#       if ($block_referer = 1) {
#           return 403;
#       }
#       
#       # Your normal location blocks...
#       location / {
#           ...
#       }
#   }
#
# For login pages, use stricter rate limiting:
#
#   location = /wp-login.php {
#       limit_req zone=8g_login burst=3 nodelay;
#       ...
#   }
#
# ========================================================================
# END 8G FIREWALL
# ========================================================================
